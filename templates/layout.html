<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if title %}{{ title }} | {{ site_title }}{% else %}{{ site_title }}{% endif %}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="site-shell">
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-branding">
          <p class="site-kicker">singletoned.com</p>
          <a class="site-title" href="/">{{ site_title }}</a>
        </div>

        <nav class="site-nav" aria-label="Primary">
          <a href="/">Writing</a>
          <a href="/about.html">About</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="site-main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div>
        <p>&copy; {{ current_year }} {{ site_title }}</p>
      </div>
      <div class="site-footer__links">
        <a href="/tredmarx/">TredMarx app pages</a>
      </div>
    </footer>
  </div>
</body>
</html>
