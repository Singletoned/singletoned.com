{% extends "layout.html" %} {% block content %}
<article class="content-panel post">
  <header class="content-header post-header">
    <p class="eyebrow">Post</p>
    <h1>{{ post.title }}</h1>
    <p class="meta">
      <time datetime="{{ post.date }}">{{ post.date }}</time>
      <span class="reading-time">{{ post.reading_time }}</span>
    </p>
    {% if post.tags %}
    <div class="tags" aria-label="Tags">
      {% for tag in post.tags %}
      <span class="tag">#{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="post-content prose">{{ post.content | safe }}</div>
</article>

<nav class="back-nav" aria-label="Back">
  <a href="/">&larr; Back to writing</a>
</nav>
{% endblock %}
