[project]
name = "singletoned-com"
version = "0.1.0"
description = "Simple static blog"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.5",
    "python-frontmatter>=1.1",
    "watchdog>=4.0",
    "beautifulsoup4>=4.12",
]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "I"]
unfixable = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["singletoned-com"]
